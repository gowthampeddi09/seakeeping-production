# vessels/sol_progress.yaml
# Vessel Specification: SOL PROGRESS (IMO: 9322865, Built: 2006)
# Multi-protocol: NMEA 0183 (Navigation) + Modbus TCP (Engine/Steering PLC)
vessel:
  name: "SOL PROGRESS"
  imo: "9322865"
  static:
    # Principal Particulars & Hydrostatics
    ship_length: 190.0       # LOA (Length Overall) [m]
    lpp: 182.0               # LPP (Length Between Perpendiculars) [m]
    loa: 190.0               # LOA [m]
    ship_beam: 32.2          # Maximum breadth (Beam) [m]
    beam: 32.2               # Beam [m]
    ship_draft: 12.5         # Mean draft [m]
    draft_fwd: 12.5          # Forward draft [m]
    draft_aft: 12.5           # Aft draft [m]
    draft_mean: 12.5         # Mean draft [m]
    displacement: 55000.0    # Total vessel mass/displacement [tonnes]
    block_coefficient: 0.80  # Block coefficient Cb
    cb: 0.80
    KG: 12.0                 # Height of CG above keel [m]
    GM_static: 1.50          # Static metacentric height [m]
    lcg: 0.0                 # Longitudinal position of CG [m]
    freeboard: 5.0           # Height of weather deck above waterline [m]
    air_draft: 45.0          # Height from waterline to highest mast [m]
    water_density: 1025.0    # Seawater density [kg/m³]

    # Propulsion & Maneuvering Particulars
    num_propellers: 1
    propeller_diameter: 6.2  # Propeller diameter [m]
    rudder_area: 28.5        # Projected rudder area [m²]
    rudder_height: 5.5       # Vertical span of rudder [m]
    rudder_chord: 5.2        # Chord length of rudder [m]
    avs: 55.0                # Angle of vanishing stability [deg]
    full_ahead_rpm: 105.0    # Engine full ahead RPM
    full_ahead_speed_kn: 14.5 # Full ahead speed [knots]

# NMEA 0183 Connection (Navigation Bridge)
connection:
  type: "udp"
  ip: "0.0.0.0"
  port: 10110

# Modbus TCP Connection (Engine Room PLC)
modbus_connection:
  type: "tcp"
  host: "192.168.1.100"
  port: 502
  slave_id: 1
  timeout: 1.0

# NMEA 0183 Sentence Mapping Table
sensor_map:
  heading:
    sentences: ["HEHDT", "GPHDT", "AGHDT", "HCHDT"]
    field_index: 1
    unit: "degrees"
    conversion: 1.0
    range: [0.0, 360.0]
    timeout_ms: 1000

  speed:
    sentences: ["VWVHW", "VDVBW", "GPVTG"]
    field_index: 5
    unit: "knots"
    conversion: 1.0
    range: [0.0, 25.0]
    timeout_ms: 1000

  sog:
    sentences: ["GPVTG", "GPRMC"]
    field_index: 5
    unit: "knots"
    conversion: 1.0
    range: [0.0, 25.0]
    timeout_ms: 1000

  cog:
    sentences: ["GPVTG", "GPRMC"]
    field_index: 1
    unit: "degrees"
    conversion: 1.0
    range: [0.0, 360.0]
    timeout_ms: 1000

  lat:
    sentences: ["GPGGA", "GPRMC", "GPGLL"]
    field_index: 2
    unit: "degrees"
    conversion: 1.0
    range: [-90.0, 90.0]
    timeout_ms: 2000

  lon:
    sentences: ["GPGGA", "GPRMC", "GPGLL"]
    field_index: 4
    unit: "degrees"
    conversion: 1.0
    range: [-180.0, 180.0]
    timeout_ms: 2000

  wind_speed:
    sentences: ["WIMWD", "WIMWV"]
    field_index: 5
    unit: "knots"
    conversion: 0.5144
    range: [0.0, 60.0]
    timeout_ms: 2000

  wind_direction:
    sentences: ["WIMWD", "WIMWV"]
    field_index: 1
    unit: "degrees"
    conversion: 1.0
    range: [0.0, 360.0]
    timeout_ms: 2000

  yaw_rate:
    sentences: ["GPROT", "HEROT"]
    field_index: 1
    unit: "deg_per_min"
    conversion: 0.0166667
    range: [-30.0, 30.0]
    timeout_ms: 1000

  roll:
    sentences: ["PHTRO", "PSXN20", "PFEC"]
    field_index: 1
    unit: "degrees"
    conversion: 1.0
    range: [-60.0, 60.0]
    timeout_ms: 500

  pitch:
    sentences: ["PHTRO", "PSXN20", "PFEC"]
    field_index: 2
    unit: "degrees"
    conversion: 1.0
    range: [-30.0, 30.0]
    timeout_ms: 500

  surge_vel:
    sentences: ["PHTRO", "PSXN20"]
    field_index: 3
    unit: "m_per_s"
    conversion: 1.0
    range: [-10.0, 20.0]
    timeout_ms: 500

  sway_vel:
    sentences: ["PHTRO", "PSXN20"]
    field_index: 4
    unit: "m_per_s"
    conversion: 1.0
    range: [-10.0, 10.0]
    timeout_ms: 500

  wave_z:
    sentences: ["PWAV", "WMWAV"]
    field_index: 1
    unit: "meters"
    conversion: 1.0
    range: [-15.0, 15.0]
    timeout_ms: 2000

  Hs:
    sentences: ["PWAV", "WMWAV"]
    field_index: 2
    unit: "meters"
    conversion: 1.0
    range: [0.0, 20.0]
    timeout_ms: 5000

  Tp:
    sentences: ["PWAV", "WMWAV"]
    field_index: 3
    unit: "seconds"
    conversion: 1.0
    range: [2.0, 30.0]
    timeout_ms: 5000

  depth:
    sentences: ["SDDPT", "SDDBT", "INDPT"]
    field_index: 1
    unit: "meters"
    conversion: 1.0
    range: [0.5, 500.0]
    timeout_ms: 2000

  wave_direction:
    sentences: ["PWAV", "WMWAV"]
    field_index: 4
    unit: "degrees"
    conversion: 1.0
    range: [0.0, 360.0]
    timeout_ms: 5000

# Modbus Register Mapping Table
modbus_map:
  engine_rpm:
    address: 40001
    register_type: "holding"
    data_type: "uint16"
    scale: 0.1
    offset: 0.0
    range: [0.0, 200.0]
    timeout_ms: 2000

  rudder:
    address: 40002
    register_type: "holding"
    data_type: "int16"
    scale: 0.1
    offset: 0.0
    range: [-35.0, 35.0]
    timeout_ms: 2000

  shaft_power:
    address: 40003
    register_type: "holding"
    data_type: "uint16"
    scale: 1.0
    offset: 0.0
    range: [0.0, 50000.0]
    timeout_ms: 2000

  shaft_torque:
    address: 40004
    register_type: "holding"
    data_type: "uint16"
    scale: 0.1
    offset: 0.0
    range: [0.0, 10000.0]
    timeout_ms: 2000
