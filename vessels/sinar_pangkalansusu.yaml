# vessels/sinar_pangkalansusu.yaml
# Production Vessel Specification: SINAR PANGKALANSUSU (IMO 1043516, Built: 2024)
# Shipyard: Ningbo Xinle Shipbuilding Co., Ltd., China
# Operator: PT Samudera Indonesia (Indonesian Flag)
vessel:
  name: "SINAR PANGKALANSUSU"
  imo: "1043516"
  flag: "Indonesia"
  vessel_type: "Container Feeder (approx 700 TEU)"
  static:
    # Principal Particulars & Hydrostatics (Ningbo Xinle / Samudera Indonesia Verified)
    ship_length: 128.00      # Length Overall (LOA) [m]
    loa: 128.00              # Length Overall (LOA) [m]
    lpp: 119.50              # Length Between Perpendiculars (LBP) [m]
    ship_beam: 22.00         # Moulded Breadth (Beam) [m]
    beam: 22.00              # Beam [m]
    depth_moulded: 9.00      # Moulded Depth [m]
    ship_draft: 5.50         # Design Operating Draught [m]
    draft_summer: 7.20       # Scantling / Summer Load Draught [m]
    draft_design: 5.50       # Design Draught [m]
    draft_mean: 5.50         # Operating Mean Draught [m]
    draft_fwd: 5.40          # Forward Draught [m]
    draft_aft: 5.60          # Aft Draught [m]
    displacement: 13600.0    # Full load displacement [tonnes] (DWT 10,162 t + Lightship 3,438 t)
    dwt: 10162.0             # Deadweight [tonnes]
    gross_tonnage: 7500.0    # Gross Tonnage [GT]
    lightship: 3438.0        # Lightship [tonnes]
    block_coefficient: 0.708 # Block coefficient Cb at design draft
    cb: 0.708
    KG: 7.20                 # Height of CG above keel [m]
    KM: 8.45                 # Transverse metacentre height above keel [m]
    GM_static: 1.25          # Static metacentric height [m]
    lcg: 0.30                # Longitudinal position of CG fwd of midships [m]
    freeboard: 3.50          # Operating freeboard [m] (Depth 9.0m - Draft 5.5m)
    air_draft: 36.00         # Air draft [m]
    water_density: 1025.0    # Seawater density [kg/m³]

    # Propulsion & Maneuvering Particulars
    main_engine: "Marine Diesel Engine ~4,500 kW"
    mcr_power_kw: 4500.0     # Rated engine power [kW]
    num_propellers: 1
    propeller_diameter: 4.60 # Propeller diameter [m]
    rudder_area: 15.20       # Rudder area [m²]
    rudder_height: 4.50      # Rudder height [m]
    rudder_chord: 3.40       # Rudder chord [m]
    rudder_max_angle: 35.0   # Maximum rudder angle [deg]
    avs: 58.0                # Angle of vanishing stability [deg]
    full_ahead_rpm: 130.0    # Engine full ahead RPM
    full_ahead_speed_kn: 14.5 # Full ahead speed [knots]
    service_speed_kn: 13.5   # Service speed [knots]

connection:
  type: "udp"
  ip: "0.0.0.0"
  port: 10110 # UDP Broadcast port on Ship's Local Network Switch

sensor_map:
  heading:
    sentences: ["HEHDT", "GPHDT", "AGHDT", "HCHDT"]
    field_index: 1
    unit: "degrees"
    conversion: 1.0
    range: [0.0, 360.0]
    timeout_ms: 1000

  speed:
    sentences: ["VWVHW", "VDVBW", "GPVTG"]
    field_index: 5
    unit: "knots"
    conversion: 1.0
    range: [0.0, 30.0]
    timeout_ms: 1000

  wind_speed:
    sentences: ["WIMWD", "WIMWV"]
    field_index: 5
    unit: "knots"
    conversion: 0.5144
    range: [0.0, 60.0]
    timeout_ms: 2000

  wind_direction:
    sentences: ["WIMWD", "WIMWV"]
    field_index: 1
    unit: "degrees"
    conversion: 1.0
    range: [0.0, 360.0]
    timeout_ms: 2000

  engine_rpm:
    sentences: ["VWRPM", "ERRPM"]
    field_index: 3
    unit: "rpm"
    conversion: 1.0
    range: [0.0, 200.0]
    timeout_ms: 2000

  rudder:
    sentences: ["GPRSA", "AGRSA"]
    field_index: 1
    unit: "degrees"
    conversion: 1.0
    range: [-35.0, 35.0]
    timeout_ms: 2000

  yaw_rate:
    sentences: ["GPROT", "HEROT"]
    field_index: 1
    unit: "deg_per_min"
    conversion: 0.0166667
    range: [-30.0, 30.0]
    timeout_ms: 1000

  roll:
    sentences: ["PHTRO", "PSXN20", "PFEC"]
    field_index: 1
    unit: "degrees"
    conversion: 1.0
    range: [-60.0, 60.0]
    timeout_ms: 500

  pitch:
    sentences: ["PHTRO", "PSXN20", "PFEC"]
    field_index: 2
    unit: "degrees"
    conversion: 1.0
    range: [-30.0, 30.0]
    timeout_ms: 500

  surge_vel:
    sentences: ["PHTRO", "PSXN20"]
    field_index: 3
    unit: "m_per_s"
    conversion: 1.0
    range: [-10.0, 20.0]
    timeout_ms: 500

  sway_vel:
    sentences: ["PHTRO", "PSXN20"]
    field_index: 4
    unit: "m_per_s"
    conversion: 1.0
    range: [-10.0, 10.0]
    timeout_ms: 500

  wave_z:
    sentences: ["PWAV", "WMWAV"]
    field_index: 1
    unit: "meters"
    conversion: 1.0
    range: [-15.0, 15.0]
    timeout_ms: 2000

  Hs:
    sentences: ["PWAV", "WMWAV"]
    field_index: 2
    unit: "meters"
    conversion: 1.0
    range: [0.0, 20.0]
    timeout_ms: 5000

  Tp:
    sentences: ["PWAV", "WMWAV"]
    field_index: 3
    unit: "seconds"
    conversion: 1.0
    range: [2.0, 30.0]
    timeout_ms: 5000

  wave_direction:
    sentences: ["PWAV", "WMWAV"]
    field_index: 4
    unit: "degrees"
    conversion: 1.0
    range: [0.0, 360.0]
    timeout_ms: 5000
